<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 430 96" role="img" aria-labelledby="title desc">
  <title id="title">Tecnotitan logo</title>
  <desc id="desc">Futuristic Tecnotitan wordmark inspired by illuminated industrial signage.</desc>
  <defs>
    <linearGradient id="letters" x1="0" y1="18" x2="0" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#effcff"/>
      <stop offset="1" stop-color="#a9c4cc"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="430" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67e5ff" stop-opacity="0"/>
      <stop offset="0.46" stop-color="#67e5ff" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#67e5ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-80%" width="120%" height="260%">
      <feGaussianBlur stdDeviation="2.4" result="blur"/>
      <feColorMatrix
        in="blur"
        type="matrix"
        values="0 0 0 0 0.40  0 0 0 0 0.90  0 0 0 0 1.00  0 0 0 0.62 0"
        result="cyanGlow"
      />
      <feMerge>
        <feMergeNode in="cyanGlow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="430" height="96" fill="none"/>
  <g filter="url(#glow)">
    <text
      x="5"
      y="61"
      fill="url(#letters)"
      stroke="#f7fdff"
      stroke-width="0.45"
      font-family="'Bank Gothic', 'Eurostile Extended', 'Orbitron', 'Arial Black', Arial, sans-serif"
      font-size="34"
      font-weight="800"
      letter-spacing="7.2"
    >TECNOTITAN</text>
    <path d="M8 70H108M260 70h154" stroke="url(#shine)" stroke-width="2"/>
    <path d="M7 24h35M352 24h61" stroke="#67e5ff" stroke-width="1.5" opacity="0.72"/>
  </g>
</svg>
